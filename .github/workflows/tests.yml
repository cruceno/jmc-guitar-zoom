name: tests

on:
  push:
  pull_request:

jobs:
  offscreen:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Qt and ALSA runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libasound2t64
      - run: uv sync
      - name: Tests (the zoom_files tests are skipped: no Zoom files are downloaded)
        run: uv run pytest -q
