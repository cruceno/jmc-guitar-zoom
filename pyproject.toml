[project]
name = "zoom-studio"
version = "0.1.0"
description = "Qt desktop editor for Zoom FOUR-series pedals (A1 FOUR), forked from mungewell/zoom-zt2"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.8",
    "mido==1.3.3",
    "python-rtmidi>=1.5",
    "construct==2.10.70",
    "crcmod==1.7",
]

[project.scripts]
zoom-studio = "zoomstudio.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
