[project]
name = "jmc-guitar-zoom"
version = "0.1.0"
description = "Unofficial Qt desktop editor for the Zoom A1 FOUR guitar pedal (independent derivative of mungewell/zoom-zt2)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md"]
keywords = ["zoom", "a1-four", "guitar", "pedal", "midi", "sysex", "pyside6"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.8",
    "mido==1.3.3",
    "python-rtmidi>=1.5",
    "construct==2.10.70",
    "crcmod==1.7",
]

[project.urls]
Homepage = "https://github.com/cruceno/jmc-guitar-zoom"
Repository = "https://github.com/cruceno/jmc-guitar-zoom"
Issues = "https://github.com/cruceno/jmc-guitar-zoom/issues"

[project.scripts]
jmc-guitar-zoom = "jmc_guitar_zoom.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.11,<7",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/support"]
markers = ["zoom_files: needs the files scripts/fetch_test_fixtures.py downloads from Zoom (skipped without them)"]
